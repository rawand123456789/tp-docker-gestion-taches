
services:
  db:
    image: postgres:16-alpine
    container_name: tp3-db
    environment:
      POSTGRES_DB: tp3db
      POSTGRES_USER: tp3user
      POSTGRES_PASSWORD: tp3pass
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tp3user -d tp3db"]
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build: ./api
    container_name: tp3-backend
    environment:
      DATABASE_URL: postgres://tp3user:tp3pass@db:5432/tp3db
      PORT: 3000
    ports:
      - "3000:3000"
    depends_on:
      db:
        condition: service_healthy

  frontend:
    build: ./react-app
    container_name: tp3-frontend
    ports:
      - "5173:5173"
    depends_on:
      - backend

  cadvisor:
    image: gcr.io/cadvisor/cadvisor:v0.49.1
    container_name: tp3-cadvisor
    ports:
      - "8081:8080"
    privileged: true
    devices:
      - /dev/kmsg
    volumes:
      - /:/rootfs:ro
      - /var/run:/var/run:ro
      - /sys:/sys:ro
      - /var/lib/docker:/var/lib/docker:ro
      - /dev/disk:/dev/disk:ro

  prometheus:
    image: prom/prometheus:v3.5.0
    container_name: tp3-prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    depends_on:
      - cadvisor

  grafana:
    image: grafana/grafana:12.2.0
    container_name: tp3-grafana
    ports:
      - "3001:3000"
    volumes:
      - grafana_data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  postgres_data:
  prometheus_data:
  grafana_data:

