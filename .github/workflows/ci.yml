
name: Docker CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

jobs:
  build:
    name: Build Docker Images
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Check Docker
        run: docker --version

      - name: Build Backend Image
        run: docker build -t gestion-taches-api ./api

      - name: Build Frontend Image
        run: docker build -t gestion-taches-frontend ./react-app
